name: glimpse-nginx

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  nginx:
    image: ${NGINX_IMAGE:-dangtri73/glimpse-nginx:latest}
    container_name: glimpse-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DEV_DOMAIN: ${DEV_DOMAIN:-dev.api.hftvn.com}
      GLIMPSE_DOMAIN: ${GLIMPSE_DOMAIN:-glimpse-go.site}
      GLIMPSE_WWW_DOMAIN: ${GLIMPSE_WWW_DOMAIN:-www.glimpse-go.site}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-dashboard.glimpse-go.site}
      AI_DOMAIN: ${AI_DOMAIN:-ai.glimpse-go.site}
      OLLAMA_DOMAIN: ${OLLAMA_DOMAIN:-ollama.glimpse-go.site}
      MLX_DOMAIN: ${MLX_DOMAIN:-mlx.glimpse-go.site}
      MACSTUDIO_LAN_IP: "${MACSTUDIO_LAN_IP:?Set MACSTUDIO_LAN_IP in .env}"
      DEV_SSL_CERTIFICATE: ${DEV_SSL_CERTIFICATE:-/etc/letsencrypt/live/dev.api.hftvn.com/fullchain.pem}
      DEV_SSL_CERTIFICATE_KEY: ${DEV_SSL_CERTIFICATE_KEY:-/etc/letsencrypt/live/dev.api.hftvn.com/privkey.pem}
      GLIMPSE_SSL_CERTIFICATE: ${GLIMPSE_SSL_CERTIFICATE:-/etc/ssl/cloudflare/glimpse-go.site/fullchain.pem}
      GLIMPSE_SSL_CERTIFICATE_KEY: ${GLIMPSE_SSL_CERTIFICATE_KEY:-/etc/ssl/cloudflare/glimpse-go.site/privkey.pem}
      DEV_UPSTREAM: "${DEV_UPSTREAM:?Run ./deploy.sh deploy or set DEV_UPSTREAM in .env}"
      DEFAULT_UPSTREAM: "${DEFAULT_UPSTREAM:?Run ./deploy.sh deploy or set DEFAULT_UPSTREAM in .env}"
      DASHBOARD_UPSTREAM: "${DASHBOARD_UPSTREAM:?Run ./deploy.sh deploy or set DASHBOARD_UPSTREAM in .env}"
      AI_UPSTREAM: "${AI_UPSTREAM:?Run ./deploy.sh deploy or set AI_UPSTREAM in .env}"
      OLLAMA_UPSTREAM: "${OLLAMA_UPSTREAM:?Run ./deploy.sh deploy or set OLLAMA_UPSTREAM in .env}"
      MLX_UPSTREAM: "${MLX_UPSTREAM:?Run ./deploy.sh deploy or set MLX_UPSTREAM in .env}"
      NGINX_TEMPLATE_MODE: ${NGINX_TEMPLATE_MODE:-dev-ssl}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/generated:/etc/nginx/generated:ro
      - ${DEV_SSL_HOST_DIR:-./certs/letsencrypt}:/etc/letsencrypt:ro
      - ${GLIMPSE_SSL_HOST_DIR:-./certs/cloudflare}:/etc/ssl/cloudflare:ro
    logging: *default-logging
