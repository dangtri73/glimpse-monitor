name: glimpse-nginx

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  nginx:
    image: ${NGINX_IMAGE:-dangtri73/glimpse-nginx:latest}
    container_name: glimpse-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DEV_DOMAIN: ${DEV_DOMAIN:-dev.api.hftvn.com}
      GLIMPSE_DOMAIN: ${GLIMPSE_DOMAIN:-glimpse-go.site}
      GLIMPSE_WWW_DOMAIN: ${GLIMPSE_WWW_DOMAIN:-www.glimpse-go.site}
      DEV_SSL_CERTIFICATE: ${DEV_SSL_CERTIFICATE:-/etc/letsencrypt/live/dev.api.hftvn.com/fullchain.pem}
      DEV_SSL_CERTIFICATE_KEY: ${DEV_SSL_CERTIFICATE_KEY:-/etc/letsencrypt/live/dev.api.hftvn.com/privkey.pem}
      GLIMPSE_SSL_CERTIFICATE: ${GLIMPSE_SSL_CERTIFICATE:-/etc/ssl/cloudflare/glimpse-go.site/fullchain.pem}
      GLIMPSE_SSL_CERTIFICATE_KEY: ${GLIMPSE_SSL_CERTIFICATE_KEY:-/etc/ssl/cloudflare/glimpse-go.site/privkey.pem}
      DEFAULT_UPSTREAM: ${DEFAULT_UPSTREAM:-http://192.168.1.3:11435}
      NGINX_TEMPLATE_MODE: ${NGINX_TEMPLATE_MODE:-dev-ssl}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/generated:/etc/nginx/generated:ro
      - ${DEV_SSL_HOST_DIR:-./certs/letsencrypt}:/etc/letsencrypt:ro
      - ${GLIMPSE_SSL_HOST_DIR:-./certs/cloudflare}:/etc/ssl/cloudflare:ro
    logging: *default-logging
