name: glimpse-nginx

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  nginx:
    image: ${NGINX_IMAGE:-dangtri73/glimpse-nginx:latest}
    container_name: glimpse-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      TASK_DEV_DOMAIN: ${TASK_DEV_DOMAIN:-task-dev.hanwhafintech.com}
      TASK_DEV_API_DOMAIN: ${TASK_DEV_API_DOMAIN:-task-api-dev.hanwhafintech.com}
      TASK_PROD_DOMAIN: ${TASK_PROD_DOMAIN:-task.hanwhafintech.com}
      TASK_PROD_API_DOMAIN: ${TASK_PROD_API_DOMAIN:-task-api.hanwhafintech.com}
      REPORT_ST_DOMAIN: ${REPORT_ST_DOMAIN:-report-st.hanwhafintech.com}
      REPORT_ST_API_DOMAIN: ${REPORT_ST_API_DOMAIN:-report-st-api.hanwhafintech.com}
      REPORT_DOMAIN: ${REPORT_DOMAIN:-report.hanwhafintech.com}
      REPORT_API_DOMAIN: ${REPORT_API_DOMAIN:-report-api.hanwhafintech.com}
      API_RAG_RUNTIME_ST_DOMAIN: ${API_RAG_RUNTIME_ST_DOMAIN:-api-rag-runtime-st.hanwhafintech.com}
      H_Q1_DOMAIN: ${H_Q1_DOMAIN:-h-q1.hanwhafintech.com}
      H_ASSISTANT_PLAYGROUND_DOMAIN: ${H_ASSISTANT_PLAYGROUND_DOMAIN:-h-assistant-playground.hanwhafintech.com}
      EMBED_DOMAIN: ${EMBED_DOMAIN:-embed.glimpse-go.site}
      RERANK_DOMAIN: ${RERANK_DOMAIN:-rerank.glimpse-go.site}
      MLX_DOMAIN: ${MLX_DOMAIN:-mlx.glimpse-go.site}
      MLX_CLASSIFY_DOMAIN: ${MLX_CLASSIFY_DOMAIN:-mlx-classify.glimpse-go.site}
      MLX_VLM_DOMAIN: ${MLX_VLM_DOMAIN:-mlx-vlm.glimpse-go.site}
      MACSTUDIO_LAN_IP: "${MACSTUDIO_LAN_IP:?Set MACSTUDIO_LAN_IP in .env}"
      HANWHA_SSL_CERTIFICATE: ${HANWHA_SSL_CERTIFICATE:-/etc/ssl/cloudflare/hanwhafintech.com/fullchain.pem}
      HANWHA_SSL_CERTIFICATE_KEY: ${HANWHA_SSL_CERTIFICATE_KEY:-/etc/ssl/cloudflare/hanwhafintech.com/privkey.pem}
      GLIMPSE_SSL_CERTIFICATE: ${GLIMPSE_SSL_CERTIFICATE:-/etc/ssl/cloudflare/glimpse-go.site/fullchain.pem}
      GLIMPSE_SSL_CERTIFICATE_KEY: ${GLIMPSE_SSL_CERTIFICATE_KEY:-/etc/ssl/cloudflare/glimpse-go.site/privkey.pem}
      TASK_DEV_UPSTREAM: "${TASK_DEV_UPSTREAM:?Run ./deploy.sh deploy or set TASK_DEV_UPSTREAM in .env}"
      TASK_DEV_API_UPSTREAM: "${TASK_DEV_API_UPSTREAM:?Run ./deploy.sh deploy or set TASK_DEV_API_UPSTREAM in .env}"
      TASK_PROD_UPSTREAM: "${TASK_PROD_UPSTREAM:?Run ./deploy.sh deploy or set TASK_PROD_UPSTREAM in .env}"
      TASK_PROD_API_UPSTREAM: "${TASK_PROD_API_UPSTREAM:?Run ./deploy.sh deploy or set TASK_PROD_API_UPSTREAM in .env}"
      REPORT_ST_UPSTREAM: "${REPORT_ST_UPSTREAM:?Run ./deploy.sh deploy or set REPORT_ST_UPSTREAM in .env}"
      REPORT_ST_API_UPSTREAM: "${REPORT_ST_API_UPSTREAM:?Run ./deploy.sh deploy or set REPORT_ST_API_UPSTREAM in .env}"
      REPORT_UPSTREAM: "${REPORT_UPSTREAM:?Run ./deploy.sh deploy or set REPORT_UPSTREAM in .env}"
      REPORT_API_UPSTREAM: "${REPORT_API_UPSTREAM:?Run ./deploy.sh deploy or set REPORT_API_UPSTREAM in .env}"
      API_RAG_RUNTIME_ST_UPSTREAM: "${API_RAG_RUNTIME_ST_UPSTREAM:?Run ./deploy.sh deploy or set API_RAG_RUNTIME_ST_UPSTREAM in .env}"
      H_Q1_UPSTREAM: "${H_Q1_UPSTREAM:?Run ./deploy.sh deploy or set H_Q1_UPSTREAM in .env}"
      H_ASSISTANT_PLAYGROUND_UPSTREAM: "${H_ASSISTANT_PLAYGROUND_UPSTREAM:?Run ./deploy.sh deploy or set H_ASSISTANT_PLAYGROUND_UPSTREAM in .env}"
      EMBED_UPSTREAM: "${EMBED_UPSTREAM:?Run ./deploy.sh deploy or set EMBED_UPSTREAM in .env}"
      RERANK_UPSTREAM: "${RERANK_UPSTREAM:?Run ./deploy.sh deploy or set RERANK_UPSTREAM in .env}"
      MLX_UPSTREAM: "${MLX_UPSTREAM:?Run ./deploy.sh deploy or set MLX_UPSTREAM in .env}"
      MLX_CLASSIFY_UPSTREAM: "${MLX_CLASSIFY_UPSTREAM:?Run ./deploy.sh deploy or set MLX_CLASSIFY_UPSTREAM in .env}"
      MLX_VLM_UPSTREAM: "${MLX_VLM_UPSTREAM:?Run ./deploy.sh deploy or set MLX_VLM_UPSTREAM in .env}"
      NGINX_TEMPLATE_MODE: ${NGINX_TEMPLATE_MODE:-ssl}
    volumes:
      - ./nginx/generated:/etc/nginx/generated:ro
      - ${GLIMPSE_SSL_HOST_DIR:-./certs/cloudflare}:/etc/ssl/cloudflare:ro
    logging: *default-logging
