name: Build and deploy app services

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "ai-service/**"
      - "workers/**"
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/app-services.yml"
  workflow_dispatch:
    inputs:
      service:
        description: Service to build and deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - dashboard
          - ai-service
          - workers

concurrency:
  group: macstudio-app-deploy
  cancel-in-progress: false

env:
  DOCKER_PLATFORM: ${{ vars.DOCKER_PLATFORM || 'linux/arm64' }}
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'dangtri73' }}
  IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || 'glimpse-monitor' }}
  MACSTUDIO_ENV_FILE: ${{ vars.MACSTUDIO_ENV_FILE || '/Users/vutri/Desktop/projects/Glimpse/glimpse-monitor/infra/.env' }}
  MACSTUDIO_DOCKER_SOCKET: ${{ vars.MACSTUDIO_DOCKER_SOCKET || '' }}

jobs:
  build-and-deploy:
    runs-on: [self-hosted, macOS, ARM64, macstudio]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed services
        run: |
          set -eu

          add_target() {
            case " $targets " in
              *" $1 "*) ;;
              *) targets="$targets $1" ;;
            esac
          }

          targets=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            targets="${{ inputs.service }}"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              targets="all"
            else
              changed_files="$(git diff --name-only "$before" "$GITHUB_SHA")"
              if printf '%s\n' "$changed_files" | grep -Eq '^(infra|scripts)/|^\.github/workflows/app-services\.yml$'; then
                targets="all"
              else
                printf '%s\n' "$changed_files" | grep -q '^dashboard/' && add_target dashboard
                printf '%s\n' "$changed_files" | grep -q '^ai-service/' && add_target ai-service
                printf '%s\n' "$changed_files" | grep -q '^workers/' && add_target workers
              fi
            fi
          fi

          if [ -z "$targets" ]; then
            echo "No deployable service changed."
            targets="none"
          fi

          short_sha="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$short_sha" >> "$GITHUB_ENV"
          echo "TARGETS=$targets" >> "$GITHUB_ENV"
          echo "Targets: $targets"

      - name: Configure Docker Hub auth
        if: env.TARGETS != 'none'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          docker_config="${RUNNER_TEMP:-$PWD/.runner-temp}/docker-config"
          mkdir -p "$docker_config"
          chmod 700 "$docker_config"
          auth="$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')"
          printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}\n' "$auth" > "$docker_config/config.json"
          chmod 600 "$docker_config/config.json"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"

      - name: Configure Docker daemon
        if: env.TARGETS != 'none'
        run: |
          set -eu

          if docker info >/dev/null 2>&1; then
            docker info --format 'Docker server: {{.ServerVersion}}'
            exit 0
          fi

          for socket in \
            "$MACSTUDIO_DOCKER_SOCKET" \
            "$HOME/.docker/run/docker.sock" \
            "$HOME/.colima/default/docker.sock" \
            "/Users/admin/.docker/run/docker.sock" \
            "/Users/admin/.colima/default/docker.sock"
          do
            [ -n "$socket" ] || continue
            case "$socket" in
              unix://*)
                socket_path="${socket#unix://}"
                docker_host="$socket"
                ;;
              *)
                socket_path="$socket"
                docker_host="unix://$socket"
                ;;
            esac
            [ -S "$socket_path" ] || [ -e "$socket_path" ] || continue

            export DOCKER_HOST="$docker_host"
            if docker info >/dev/null 2>&1; then
              echo "DOCKER_HOST=$DOCKER_HOST" >> "$GITHUB_ENV"
              docker info --format 'Docker server: {{.ServerVersion}}'
              exit 0
            fi
          done

          echo "ERROR: Docker daemon is not reachable from the runner service." >&2
          echo "User: $(id)" >&2
          echo "HOME: $HOME" >&2
          docker context ls >&2 || true
          ls -la "$HOME/.docker" >&2 || true
          ls -la "$HOME/.colima/default" >&2 || true
          ls -la /var/run/docker.sock >&2 || true
          exit 1

      - name: Build and push changed service images
        if: env.TARGETS != 'none'
        run: |
          set -eu
          test -f "$DOCKER_CONFIG/config.json"
          for target in $TARGETS; do
            DOCKERHUB_NAMESPACE="$DOCKERHUB_NAMESPACE" \
              IMAGE_PREFIX="$IMAGE_PREFIX" \
              IMAGE_TAG="$IMAGE_TAG" \
              DOCKER_PLATFORM="$DOCKER_PLATFORM" \
              ./scripts/docker-build-push.sh "$target"
          done

      - name: Deploy changed services on Mac Studio
        if: env.TARGETS != 'none'
        run: |
          set -eu
          for target in $TARGETS; do
            DOCKERHUB_NAMESPACE="$DOCKERHUB_NAMESPACE" \
              IMAGE_PREFIX="$IMAGE_PREFIX" \
              IMAGE_TAG="$IMAGE_TAG" \
              ENV_FILE="$MACSTUDIO_ENV_FILE" \
              ./scripts/deploy-macstudio.sh "$target"
          done
