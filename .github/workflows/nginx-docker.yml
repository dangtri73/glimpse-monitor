name: Build and deploy Nginx

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "nginx-docker/**"
      - "deploy-runtime/dev-server/nginx-docker/**"
      - ".github/workflows/nginx-docker.yml"
  workflow_dispatch:

env:
  DOCKER_PLATFORM: ${{ vars.DOCKER_PLATFORM || 'linux/arm64' }}
  NGINX_IMAGE: dangtri73/glimpse-nginx:latest
  MACSTUDIO_DOCKER_SOCKET: ${{ vars.MACSTUDIO_DOCKER_SOCKET || '' }}
  MACSTUDIO_LAN_IP: ${{ vars.MACSTUDIO_LAN_IP }}

jobs:
  build-and-deploy:
    runs-on: [self-hosted, macOS, ARM64, macstudio]
    defaults:
      run:
        working-directory: nginx-docker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image name
        run: |
          set -eu
          echo "IMAGE=$NGINX_IMAGE" >> "$GITHUB_ENV"

      - name: Configure Docker Hub auth
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          docker_config="${RUNNER_TEMP:-$PWD/.runner-temp}/docker-config"
          mkdir -p "$docker_config"
          chmod 700 "$docker_config"
          auth="$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')"
          printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}\n' "$auth" > "$docker_config/config.json"
          chmod 600 "$docker_config/config.json"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"

      - name: Configure Docker daemon
        run: |
          set -eu

          if docker info >/dev/null 2>&1; then
            docker info --format 'Docker server: {{.ServerVersion}}'
            exit 0
          fi

          for socket in \
            "$MACSTUDIO_DOCKER_SOCKET" \
            "$HOME/.docker/run/docker.sock" \
            "$HOME/.colima/default/docker.sock" \
            "/Users/admin/.docker/run/docker.sock" \
            "/Users/admin/.colima/default/docker.sock"
          do
            [ -n "$socket" ] || continue
            case "$socket" in
              unix://*)
                socket_path="${socket#unix://}"
                docker_host="$socket"
                ;;
              *)
                socket_path="$socket"
                docker_host="unix://$socket"
                ;;
            esac
            [ -S "$socket_path" ] || [ -e "$socket_path" ] || continue

            export DOCKER_HOST="$docker_host"
            if docker info >/dev/null 2>&1; then
              echo "DOCKER_HOST=$DOCKER_HOST" >> "$GITHUB_ENV"
              docker info --format 'Docker server: {{.ServerVersion}}'
              exit 0
            fi
          done

          echo "ERROR: Docker daemon is not reachable from the runner service." >&2
          echo "User: $(id)" >&2
          echo "HOME: $HOME" >&2
          docker context ls >&2 || true
          ls -la "$HOME/.docker" >&2 || true
          ls -la "$HOME/.colima/default" >&2 || true
          ls -la /var/run/docker.sock >&2 || true
          exit 1

      - name: Build and validate Nginx image
        run: |
          set -eu
          test -f "$DOCKER_CONFIG/config.json"
          ./build.sh trace
          docker build --pull --platform "$DOCKER_PLATFORM" -t "$IMAGE" .
          docker run --rm \
            -e NGINX_TEMPLATE_MODE=http \
            -e DEV_DOMAIN=dev.api.hftvn.com \
            -e GLIMPSE_DOMAIN=glimpse-go.site \
            -e GLIMPSE_WWW_DOMAIN=www.glimpse-go.site \
            -e DASHBOARD_DOMAIN=dashboard.glimpse-go.site \
            -e AI_DOMAIN=ai.glimpse-go.site \
            -e OLLAMA_DOMAIN=ollama.glimpse-go.site \
            -e MLX_DOMAIN=mlx.glimpse-go.site \
            -e MACSTUDIO_LAN_IP=127.0.0.1 \
            -e DEFAULT_UPSTREAM=http://127.0.0.1:11435 \
            -e DASHBOARD_UPSTREAM=http://127.0.0.1:3000 \
            -e AI_UPSTREAM=http://127.0.0.1:8771 \
            -e OLLAMA_UPSTREAM=http://127.0.0.1:11435 \
            -e MLX_UPSTREAM=http://127.0.0.1:8088 \
            "$IMAGE" nginx -t

      - name: Push Docker Hub image
        run: |
          set -eu
          test -f "$DOCKER_CONFIG/config.json"
          docker push "$IMAGE"

      - name: Deploy to dev server
        if: github.ref == 'refs/heads/main'
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_PORT: ${{ vars.DEV_SSH_PORT || '22' }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          DEV_NGINX_DOCKER_DIR: ${{ vars.DEV_NGINX_DOCKER_DIR || '/Users/tri/nginx-docker' }}
        run: |
          set -eu
          test -n "$DEV_SSH_HOST"
          test -n "$DEV_SSH_USER"
          test -n "$DEV_SSH_PRIVATE_KEY"
          if [ -z "$MACSTUDIO_LAN_IP" ]; then
            echo "ERROR: Set GitHub repository variable MACSTUDIO_LAN_IP to the Mac Studio LAN IP." >&2
            exit 1
          fi

          case "$MACSTUDIO_LAN_IP" in
            *[!A-Za-z0-9_.-]*)
              echo "ERROR: MACSTUDIO_LAN_IP contains unsupported characters: $MACSTUDIO_LAN_IP" >&2
              exit 1
              ;;
          esac

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEV_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEV_SSH_PORT" "$DEV_SSH_HOST" >> ~/.ssh/known_hosts

          deploy_image="$IMAGE"

          case "$DEV_NGINX_DOCKER_DIR" in
            /Users/tri/*) ;;
            *)
              echo "WARNING: DEV_NGINX_DOCKER_DIR points to a Mac Studio path, not a dev-server path." >&2
              echo "Current value: $DEV_NGINX_DOCKER_DIR" >&2
              DEV_NGINX_DOCKER_DIR="/Users/tri/nginx-docker"
              echo "Using fallback dev-server path: $DEV_NGINX_DOCKER_DIR" >&2
              ;;
          esac

          ssh -i ~/.ssh/id_ed25519 -p "$DEV_SSH_PORT" "$DEV_SSH_USER@$DEV_SSH_HOST" \
            "REMOTE_DIR='$DEV_NGINX_DOCKER_DIR' sh -s" <<'REMOTE_PREP'
          set -eu
          if [ ! -d "$REMOTE_DIR" ]; then
            echo "ERROR: remote Nginx runtime directory does not exist: $REMOTE_DIR" >&2
            echo "Set GitHub variable DEV_NGINX_DOCKER_DIR=/Users/tri/nginx-docker or create/migrate that directory on the dev server." >&2
            exit 1
          fi
          mkdir -p "$REMOTE_DIR/scripts" "$REMOTE_DIR/nginx/generated"
          REMOTE_PREP

          scp -i ~/.ssh/id_ed25519 -P "$DEV_SSH_PORT" \
            ../deploy-runtime/dev-server/nginx-docker/docker-compose.yml \
            ../deploy-runtime/dev-server/nginx-docker/.env.example \
            ../deploy-runtime/dev-server/nginx-docker/deploy.sh \
            "$DEV_SSH_USER@$DEV_SSH_HOST:$DEV_NGINX_DOCKER_DIR/"

          scp -i ~/.ssh/id_ed25519 -P "$DEV_SSH_PORT" \
            ../deploy-runtime/dev-server/nginx-docker/scripts/certs.sh \
            "$DEV_SSH_USER@$DEV_SSH_HOST:$DEV_NGINX_DOCKER_DIR/scripts/certs.sh"

          ssh -i ~/.ssh/id_ed25519 -p "$DEV_SSH_PORT" "$DEV_SSH_USER@$DEV_SSH_HOST" \
            "DEPLOY_IMAGE='$deploy_image' REMOTE_DIR='$DEV_NGINX_DOCKER_DIR' MACSTUDIO_LAN_IP='$MACSTUDIO_LAN_IP' sh -s" <<'REMOTE'
          set -eu
          cd "$REMOTE_DIR"
          chmod +x deploy.sh
          chmod +x scripts/certs.sh
          ./deploy.sh deploy "$DEPLOY_IMAGE"
          REMOTE
