name: Build and deploy Nginx

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "nginx-docker/**"
      - ".github/workflows/nginx-docker.yml"
  workflow_dispatch:

env:
  DOCKER_PLATFORM: ${{ vars.DOCKER_PLATFORM || 'linux/arm64' }}
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'dangtri73' }}
  NGINX_DOCKERHUB_REPO: ${{ vars.NGINX_DOCKERHUB_REPO || 'glimpse-nginx' }}

jobs:
  build-and-deploy:
    runs-on: [self-hosted, macOS, ARM64, macstudio]
    defaults:
      run:
        working-directory: nginx-docker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image names
        run: |
          set -eu
          short_sha="${GITHUB_SHA::7}"
          image="${DOCKERHUB_NAMESPACE}/${NGINX_DOCKERHUB_REPO}"
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Configure Docker Hub auth
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          docker_config="${RUNNER_TEMP:-$PWD/.runner-temp}/docker-config"
          mkdir -p "$docker_config"
          chmod 700 "$docker_config"
          auth="$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')"
          printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}\n' "$auth" > "$docker_config/config.json"
          chmod 600 "$docker_config/config.json"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"

      - name: Build and validate Nginx image
        run: |
          set -eu
          test -f "$DOCKER_CONFIG/config.json"
          docker build --pull --platform "$DOCKER_PLATFORM" -t "$IMAGE:$SHORT_SHA" .
          docker run --rm \
            -e NGINX_TEMPLATE_MODE=http \
            -e DEFAULT_UPSTREAM=http://127.0.0.1:11435 \
            "$IMAGE:$SHORT_SHA" nginx -t

      - name: Push Docker Hub image
        run: |
          set -eu
          test -f "$DOCKER_CONFIG/config.json"
          docker push "$IMAGE:$SHORT_SHA"

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag "$IMAGE:$SHORT_SHA" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            docker tag "$IMAGE:$SHORT_SHA" "$IMAGE:$GITHUB_REF_NAME"
            docker push "$IMAGE:$GITHUB_REF_NAME"
          fi

      - name: Deploy to dev server
        if: github.ref == 'refs/heads/main'
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_PORT: ${{ vars.DEV_SSH_PORT || '22' }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          DEV_NGINX_DOCKER_DIR: ${{ vars.DEV_NGINX_DOCKER_DIR || '/Users/tri/nginx-docker' }}
        run: |
          set -eu
          test -n "$DEV_SSH_HOST"
          test -n "$DEV_SSH_USER"
          test -n "$DEV_SSH_PRIVATE_KEY"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEV_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEV_SSH_PORT" "$DEV_SSH_HOST" >> ~/.ssh/known_hosts

          deploy_image="$IMAGE:$SHORT_SHA"

          ssh -i ~/.ssh/id_ed25519 -p "$DEV_SSH_PORT" "$DEV_SSH_USER@$DEV_SSH_HOST" \
            "REMOTE_DIR='$DEV_NGINX_DOCKER_DIR' sh -s" <<'REMOTE_PREP'
          set -eu
          mkdir -p "$REMOTE_DIR/scripts"
          REMOTE_PREP

          scp -i ~/.ssh/id_ed25519 -P "$DEV_SSH_PORT" \
            scripts/certs.sh "$DEV_SSH_USER@$DEV_SSH_HOST:$DEV_NGINX_DOCKER_DIR/scripts/certs.sh"

          ssh -i ~/.ssh/id_ed25519 -p "$DEV_SSH_PORT" "$DEV_SSH_USER@$DEV_SSH_HOST" \
            "DEPLOY_IMAGE='$deploy_image' REMOTE_DIR='$DEV_NGINX_DOCKER_DIR' sh -s" <<'REMOTE'
          set -eu

          cd "$REMOTE_DIR"
          chmod +x scripts/certs.sh

          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          if grep -q '^NGINX_IMAGE=' .env; then
            sed -i.bak "s|^NGINX_IMAGE=.*|NGINX_IMAGE=$DEPLOY_IMAGE|" .env
          else
            printf '\nNGINX_IMAGE=%s\n' "$DEPLOY_IMAGE" >> .env
          fi

          if grep -q '^NGINX_TEMPLATE_MODE=' .env; then
            true
          elif grep -q '^NGINX_TEMPLATE_DIR=.*templates-http' .env; then
            printf '\nNGINX_TEMPLATE_MODE=http\n' >> .env
          elif grep -q '^NGINX_TEMPLATE_DIR=.*templates-ssl' .env; then
            printf '\nNGINX_TEMPLATE_MODE=ssl\n' >> .env
          else
            printf '\nNGINX_TEMPLATE_MODE=dev-ssl\n' >> .env
          fi

          if docker compose version >/dev/null 2>&1; then
            docker compose pull nginx
            docker compose up -d --no-build nginx
          else
            docker-compose pull nginx
            docker-compose up -d --no-build nginx
          fi

          docker exec glimpse-nginx nginx -t
          REMOTE
